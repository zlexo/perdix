name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CLANG_FORMAT_VERSION: "22.1.8"
  CLANG_TIDY_VERSION: "22.1.8"
  # The X11 and Wayland development packages SDL3 needs to build its video
  # drivers on Linux: https://wiki.libsdl.org/SDL3/README-linux
  SDL_LINUX_PACKAGES: >-
    libx11-dev libxext-dev libxcursor-dev libxi-dev libxfixes-dev
    libxrandr-dev libxrender-dev libxss-dev libxtst-dev libwayland-dev
    libegl-dev libxkbcommon-dev wayland-protocols libdecor-0-dev

jobs:
  linux:
    name: Linux (${{ matrix.compiler }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v7
      - name: Install Ninja and SDL's dependencies
        run: sudo apt-get update -q && sudo apt-get install -y -q ninja-build $SDL_LINUX_PACKAGES
      - name: Configure
        run: cmake --preset linux-${{ matrix.compiler }}
      - name: Build
        run: cmake --build --preset linux-${{ matrix.compiler }}
      - name: Test
        run: ctest --preset linux-${{ matrix.compiler }}

  sanitizers:
    name: Linux (ASan + UBSan)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install Ninja and SDL's dependencies
        run: sudo apt-get update -q && sudo apt-get install -y -q ninja-build $SDL_LINUX_PACKAGES
      # Recent Ubuntu kernels randomize memory mappings more than older
      # AddressSanitizer runtimes expect, which can make them crash or hang.
      - name: Lower ASLR entropy for AddressSanitizer
        run: sudo sysctl vm.mmap_rnd_bits=28
      - name: Configure
        run: cmake --preset linux-asan
      - name: Build
        run: cmake --build --preset linux-asan
      - name: Test
        run: ctest --preset linux-asan

  # RFC 0001's headless job: every test, the Vulkan ones included, on Mesa's
  # lavapipe, a software Vulkan driver, with synchronization validation on. Any
  # validation message fails the test that caused it. Ubuntu 26.04 for its
  # validation layers: those of 24.04, 1.3.275, do not check the layout of an
  # image drawn to through dynamic rendering, which is how the renderer draws.
  lavapipe:
    name: Linux (lavapipe)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Install Ninja, SDL's dependencies, lavapipe and the validation layers
        run: >-
          sudo apt-get update -q && sudo apt-get install -y -q ninja-build $SDL_LINUX_PACKAGES
          mesa-vulkan-drivers vulkan-validationlayers
      - name: Configure
        run: cmake --preset linux-lavapipe
      - name: Build
        run: cmake --build --preset linux-lavapipe
      - name: Test
        run: ctest --preset linux-lavapipe

  # macOS minutes bill at ten times the Linux rate on private repositories,
  # so this job only runs once the repository is public, where they are free.
  macos:
    name: macOS (Apple Clang)
    if: ${{ !github.event.repository.private }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Install Ninja
        run: brew install ninja
      - name: Configure
        run: cmake --preset mac-debug
      - name: Build
        run: cmake --build --preset mac-debug
      - name: Test
        run: ctest --preset mac-debug

  format:
    name: Format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install clang-format ${{ env.CLANG_FORMAT_VERSION }}
        run: pipx install "clang-format==${CLANG_FORMAT_VERSION}"
      - name: Check formatting
        run: |
          clang-format --version
          git ls-files '*.cpp' '*.hpp' | xargs clang-format --dry-run --Werror

  lint:
    name: Lint (clang-tidy)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install Ninja and SDL's dependencies
        run: sudo apt-get update -q && sudo apt-get install -y -q ninja-build $SDL_LINUX_PACKAGES
      - name: Install clang-tidy ${{ env.CLANG_TIDY_VERSION }}
        run: pipx install "clang-tidy==${CLANG_TIDY_VERSION}"
      # Configuring writes compile_commands.json and the headers generated
      # then; building writes those generated at build time, such as the
      # renderer's compiled shaders, which clang-tidy reads too.
      - name: Configure
        run: cmake --preset linux-clang
      - name: Build
        run: cmake --build --preset linux-clang
      - name: Run clang-tidy
        run: |
          clang-tidy --version
          git ls-files 'engine/*.cpp' 'app/*.cpp' | xargs clang-tidy -p build/linux-clang --quiet

  # ADR 0003: no GPU or window code in the world and mesh layers, nor in
  # RFC 0009's minecraft layer. Include paths fence off the engine's own
  # headers, but not system ones such as Vulkan's, so this checks the
  # includes themselves (#28).
  layering:
    name: Layering
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: No GPU or window headers in world, mesh and minecraft
        # git grep exits 0 on a match, 1 on none, and above 1 when it could
        # not search (a broken pattern, say), which must not pass as clean.
        run: |
          status=0
          git grep -nE '^[[:space:]]*#[[:space:]]*include[[:space:]]*[<"](vulkan/|volk\.h|vk_mem_alloc\.h|SDL[0-9]*/|SDL\.h|GLFW/)' -- engine/world engine/mesh engine/minecraft || status=$?
          if [ "$status" -eq 0 ]; then
            echo "::error::GPU or window headers in engine/world, engine/mesh or engine/minecraft (ADR 0003)"
            exit 1
          elif [ "$status" -ne 1 ]; then
            echo "::error::git grep failed with status $status, so nothing was checked"
            exit 1
          fi
