name: Bug
description: Something behaves differently from its design.
labels: ["type: fix"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should have happened
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1. 
    validations:
      required: true
  - type: textarea
    id: system
    attributes:
      label: System
      description: OS, GPU, driver (for example KosmicKrisp, MoltenVK, or the vendor driver) and the commit you built.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Console output, including any Vulkan validation messages.
      render: text
